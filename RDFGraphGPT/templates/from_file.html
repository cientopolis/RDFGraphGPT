{% extends "graph.html" %}
{% block title %}Graficar archivo RDF{% endblock %}
{% block content_2 %}
    <h1 class="fw-light">🕸️ RDFGraphGPT 🕸️</h1>
    <h2 class="fw-light">Grafica tu RDF</h2>
    <p class="fst-italic">Selecciona un archivo .ttl existente</p>

    <form action="{{url_for('graph_from_file')}}" method="post" enctype="multipart/form-data">
        <select class="form-select" name="file-name" for="file-name" id="file-name" aria-label="Default select example">
        {% for file in files %}
            <option for="file-name" value="{{file}}">{{file}}</option>
        {% endfor %}
        </select>
        <br>
        <!--<div class="mb-3">
            <input class="form-control" type="file" name="file" id="file" accept=".ttl">
        </div>-->
        <div class="d-grid gap-2">
            <button class="btn btn-light" type="submit" style="background-color:#7FB3D5; " id="btn" >Generar grafo</button>
            <button class="btn btn-light" type="button" style="display:none; background-color:#7FB3D5;" id="btnCargando" disabled>
                <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                <span role="status">Cargando...</span>
            </button>
        </div>
        <br>
    </form>
    <script src="../static/js/scripts.js"></script>
{% endblock %}
